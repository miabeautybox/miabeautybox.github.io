<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Makeup & Nail Studio</title>
  <meta name="description" content="Trang điểm cô dâu, dự tiệc • Làm nail • Nailbox thiết kế riêng • Khoá học makeup.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap&subset=vietnamese" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header" id="top">
    <div class="container header__inner">
      <a href="#top" class="logo" id="logo"></a>
      <nav class="nav" id="nav"></nav>
      <a class="btn btn--sm header__cta" data-zalo target="_blank" rel="noopener">Đặt lịch</a>
      <button class="nav-toggle" id="navToggle" aria-label="Mở menu"><span></span><span></span><span></span></button>
    </div>
  </header>

  <main>
    <!-- HERO -->
    <section class="hero">
      <div class="container hero__inner">
        <div class="hero__text">
          <p class="eyebrow" id="heroTagline"></p>
          <h1 id="heroTitle"></h1>
          <p class="lead" id="heroSubtitle"></p>
          <div class="hero__actions">
            <a class="btn" data-zalo target="_blank" rel="noopener">Đặt lịch qua Zalo</a>
            <a class="btn btn--ghost" href="#khoa-hoc">Xem khoá học</a>
          </div>
          <ul class="stats" id="heroStats"></ul>
        </div>
        <div class="hero__media" id="heroImage"></div>
      </div>
    </section>

    <!-- ABOUT -->
    <section class="section about" id="gioi-thieu" data-section="about">
      <div class="container about__inner">
        <div class="about__media" id="aboutImage"></div>
        <div>
          <p class="eyebrow" data-eyebrow></p>
          <h2 data-title></h2>
          <p id="aboutText"></p>
          <ul class="checklist" id="aboutHighlights"></ul>
        </div>
      </div>
    </section>

    <!-- SERVICES -->
    <section class="section section--tint" id="dich-vu" data-section="services">
      <div class="container">
        <div class="section__head">
          <p class="eyebrow" data-eyebrow></p>
          <h2 data-title></h2>
        </div>
        <div class="tabs" id="serviceTabs" role="tablist"></div>
        <div class="price-list" id="serviceList"></div>
      </div>
    </section>

    <!-- COURSES -->
    <section class="section" id="khoa-hoc" data-section="courses">
      <div class="container">
        <div class="section__head">
          <p class="eyebrow" data-eyebrow></p>
          <h2 data-title></h2>
        </div>
        <div class="grid grid--3" id="courseList"></div>
      </div>
    </section>

    <!-- NAILBOX -->
    <section class="section section--tint" id="nailbox" data-section="nailbox">
      <div class="container">
        <div class="section__head">
          <p class="eyebrow" data-eyebrow></p>
          <h2 data-title></h2>
          <p class="section__note" id="nailboxNote"></p>
        </div>
        <div class="chips" id="nailboxFilter"></div>
        <div class="grid grid--4" id="nailboxList"></div>
      </div>
    </section>

    <!-- GALLERY -->
    <section class="section" id="album" data-section="gallery">
      <div class="container">
        <div class="section__head">
          <p class="eyebrow" data-eyebrow></p>
          <h2 data-title></h2>
        </div>
        <div class="chips" id="galleryFilter"></div>
        <div class="gallery" id="galleryList"></div>
      </div>
    </section>

    <!-- FEEDBACK -->
    <section class="section section--tint" id="feedback" data-section="feedback">
      <div class="container">
        <div class="section__head">
          <p class="eyebrow" data-eyebrow></p>
          <h2 data-title></h2>
        </div>
        <div class="grid grid--3" id="feedbackList"></div>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="section" id="lien-he" data-section="contact">
      <div class="container contact">
        <div>
          <p class="eyebrow" data-eyebrow></p>
          <h2 data-title></h2>
          <ul class="contact__list" id="contactList"></ul>
          <div class="socials" id="socials"></div>
        </div>
        <div class="contact__map" id="contactMap"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> <span id="footerBrand"></span>. All rights reserved.</p>
    </div>
  </footer>

  <!-- Floating contact -->
  <div class="float-contact">
    <a class="float-btn float-btn--zalo" data-zalo target="_blank" rel="noopener" aria-label="Chat Zalo">Zalo</a>
    <a class="float-btn float-btn--phone" data-phone aria-label="Gọi điện">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
    </a>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox__close" data-lb="close" aria-label="Đóng">×</button>
    <button class="lightbox__nav lightbox__nav--prev" data-lb="prev" aria-label="Ảnh trước">‹</button>
    <figure class="lightbox__figure">
      <div class="lightbox__img" id="lbImg"></div>
      <figcaption id="lbCaption"></figcaption>
    </figure>
    <button class="lightbox__nav lightbox__nav--next" data-lb="next" aria-label="Ảnh sau">›</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/main.js"></script>
</body>
</html>
